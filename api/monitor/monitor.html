<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxima monitor</title>
<link rel="icon" href="%FAVICON%">
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #24262b;
    --ink-dim: #6b6f76;
    --ink-faint: #9aa0a6;
    --line: #e2e2df;
    --accent: #3f6b8a;
    --good: #4a7c59;
    --warn: #a8742a;
    --bad: #a04a44;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 20px 60px;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 4px; }
  header .masthead { display: flex; flex-direction: column; gap: 3px; }
  h1 { font-size: 34px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  /* The logo is inlined, so these rules override its own size and color
     attributes — the rule must sit on the svg itself, since a presentation
     attribute on it beats a color inherited from the wrapper. */
  header .logo { display: flex; flex: none; }
  header .logo svg { display: block; width: 120px; height: 120px; color: var(--ink); }
  h2 {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em;
    color: var(--ink-dim); margin: 30px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  h3 { font-size: 13px; font-weight: 600; margin: 18px 0 8px; color: var(--ink-dim); }
  a { color: var(--accent); }

  /* foldable sections: the summary is styled as the heading it replaces */
  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: '\25B8\00a0'; }
  details[open] > summary::before { content: '\25BE\00a0'; }
  details.sect > summary {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em;
    color: var(--ink-dim); margin: 30px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  details.sub > summary { font-size: 13px; font-weight: 600; margin: 18px 0 8px; color: var(--ink-dim); }

  .sub { color: var(--ink-faint); font-size: 12px; }
  .stamp { color: var(--ink-faint); font-size: 11px; font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 8px; }

  /* tiles */
  /* auto-fit, so a short row of tiles fills the width instead of huddling left */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  /* grid3 sections trade the flexible track count for a uniform box: three
     equal columns, and rows equal to the tallest, so every tile matches */
  .tiles.grid3 { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; }
  @media (max-width: 820px) { .tiles.grid3 { grid-template-columns: 1fr; grid-auto-rows: auto; } }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 11px 13px; }
  .tile .k { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .05em; }
  .tile .v { font-size: 19px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .n { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
  /* hero tiles carry a section's headline figure */
  .tile.hero .v { font-size: 28px; line-height: 1.15; }
  /* lines tiles carry a couple of statements rather than one figure */
  .tile.lines .v { font-size: 14px; line-height: 1.6; }

  /* tables */
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-dim); font-weight: 600; }
  th:first-child, td:first-child { text-align: left; }
  tr:last-child td { border-bottom: none; }
  td.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .scroll { overflow-x: auto; }

  .ok { color: var(--good); }
  .warn { color: var(--warn); }
  .bad { color: var(--bad); }
  .pending { color: var(--ink-faint); font-style: italic; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 7px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .bar > i.ok { background: var(--good); }
  .bar > i.warn { background: var(--warn); }
  .bar > i.bad { background: var(--bad); }
  .note { color: var(--ink-faint); font-size: 11px; margin-top: 6px; }

  /* ledger identity block, above the first section */
  .ident {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 10px 13px; margin-top: 12px; font-size: 12px; color: var(--ink-dim);
  }
  .ident div { padding: 1px 0; }
  .ident b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo"><!--LOGO--></span>
    <div class="masthead">
      <h1>Proxima monitor</h1>
      <div class="sub">Where the ledger and the network stand. Values carry their own age &mdash; see each section stamp.</div>
      <div class="sub" id="head-sub">loading…</div>
    </div>
  </header>

  <details class="sect">
    <summary>General</summary>
    <div class="ident" id="ident"></div>
  </details>

  <h2>Ledger and consensus</h2>
  <div class="tiles grid3" id="ledger"></div>

  <h2>Fair launch <span class="stamp" id="stamp-fairlaunch"></span></h2>
  <div class="tiles grid3" id="fairlaunch"></div>
  <div class="note" id="transits-note"></div>
  <details class="sub" id="transits-fold">
    <summary>Recent transits <span class="stamp" id="stamp-transits"></span></summary>
    <div id="transits"></div>
  </details>

  <details class="sect">
    <summary>Account census <span class="stamp" id="stamp-census"></span></summary>
    <div id="census"></div>
  </details>

  <h2>Network <span class="stamp" id="stamp-network"></span></h2>
  <div class="tiles" id="network"></div>
  <div id="sequencers"></div>
</div>

<script>
const POLL_MS = 15000;

// --- formatting helpers -----------------------------------------------------

// motes -> PROX with thousands separators; 1 PROX = 1e6 motes
function prox(motes) {
  if (motes === undefined || motes === null) return '-';
  return (Number(motes) / 1e6).toLocaleString(undefined, {maximumFractionDigits: 0}) + ' PROX';
}
function num(n) {
  if (n === undefined || n === null) return '-';
  return Number(n).toLocaleString();
}
function pct(x, digits) {
  if (x === undefined || x === null) return '-';
  return (100 * x).toFixed(digits === undefined ? 1 : digits) + '%';
}
function share(part, whole) {
  if (!whole) return '-';
  return pct(Number(part) / Number(whole));
}
function ago(unix) {
  if (!unix) return 'never';
  const s = Math.max(0, Math.floor(Date.now() / 1000 - unix));
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm ago';
}
// a slot count as wall-clock duration
function slotsDuration(slots, slotMs) {
  const ms = slots * slotMs;
  const d = ms / 86400000;
  if (d >= 365) return (d / 365).toFixed(1) + ' y';
  if (d >= 1) return d.toFixed(d < 10 ? 1 : 0) + ' d';
  const h = ms / 3600000;
  if (h >= 1) return h.toFixed(1) + ' h';
  return (ms / 60000).toFixed(1) + ' min';
}
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function shortHex(h) { return h && h.length > 16 ? h.slice(0, 12) + '…' : (h || '-'); }

function tile(k, v, note, cls, tileCls) {
  return '<div class="tile' + (tileCls ? ' ' + tileCls : '') + '"><div class="k">' + esc(k) + '</div>' +
         '<div class="v' + (cls ? ' ' + cls : '') + '">' + v + '</div>' +
         (note ? '<div class="n">' + note + '</div>' : '') + '</div>';
}
// withDuration is for the collected tiers, where how long the pass took is
// part of the picture. The live tier is always negligible, so it is left off.
function stamp(node, as_of, label, withDuration) {
  if (!as_of) { node.innerHTML = '<span class="pending">not collected yet</span>'; return; }
  node.innerHTML = esc((label || 'as of') + ' slot ' + as_of.slot + ' · ' + ago(as_of.unix) +
                       (withDuration ? ' · took ' + as_of.duration_ms + ' ms' : ''));
}

// --- ledger identity --------------------------------------------------------

const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                'August', 'September', 'October', 'November', 'December'];
function clockTime(dt) { return dt.toLocaleTimeString(undefined, {hour12: false}); }
function fullDate(dt) {
  return clockTime(dt) + ' ' + dt.getDate() + ' ' + MONTHS[dt.getMonth()] + ' ' + dt.getFullYear();
}
// the calendar date a slot count from now lands on; empty when the horizon is
// further out than a Date can express
function dateAfter(slots, slotMs) {
  const t = Date.now() + slots * slotMs;
  if (!isFinite(t) || Math.abs(t) > 8.64e15) return '';
  const dt = new Date(t);
  return String(dt.getDate()).padStart(2, '0') + ' ' + MONTHS[dt.getMonth()].slice(0, 3) + ', ' + dt.getFullYear();
}
// a duration in ms rendered in whichever unit reads naturally
function msDuration(ms) {
  if (ms < 1000) return ms.toFixed(ms < 10 ? 2 : 0) + ' ms';
  return (ms / 1000).toFixed(2) + ' s';
}

// The identity block is static except the clock, which ticks locally: the slot
// is a pure function of wall-clock time and the genesis parameters, the same
// way the ledger derives it.
let LEDGER = null;
function renderIdent(L) {
  LEDGER = L;
  const genesis = new Date(L.genesis_time_unix * 1000);
  el('ident').innerHTML =
    '<div>Ledger started at slot 0, <b>' + esc(fullDate(genesis)) + '</b> &mdash; <span id="ident-age"></span></div>' +
    '<div>1 slot is <b>' + esc(msDuration(L.slot_duration_ms)) + '</b> (' + num(L.ticks_per_slot) +
      ' ticks, ' + esc(msDuration(L.tick_duration_ms)) + ' each)</div>' +
    '<div>Current time <b id="ident-now"></b>, slot <b id="ident-slot"></b></div>' +
    '<div>Library <b class="mono" title="' + esc(L.library_hash) + '">' + esc(shortHex(L.library_hash)) +
      '</b> since slot <b>' + num(L.library_upgrade_slot) + '</b></div>' +
    '<div>1 ' + esc(L.token_name) + ' is <b>' + num(L.motes_per_token) + '</b> motes</div>';
  tickClock();
}
function tickClock() {
  if (!LEDGER || !el('ident-now')) return;
  const now = new Date();
  const slot = Math.max(0, Math.floor((now.getTime() - LEDGER.genesis_time_unix * 1000) / LEDGER.slot_duration_ms));
  el('ident-now').textContent = clockTime(now);
  el('ident-slot').textContent = num(slot);
  el('ident-age').textContent = num(slot) + ' slots ago (' + slotsDuration(slot, LEDGER.slot_duration_ms) + ')';
}
setInterval(tickClock, 1000);

// --- sections ---------------------------------------------------------------

function renderLedger(d) {
  const supply = Number(d.supply);
  const n = d.network;
  const covPct = supply ? Number(d.coverage_delta) / supply : 0;
  const needPct = d.healthy_denominator ? d.healthy_numerator / d.healthy_denominator : 0;
  // healthy at or above the threshold; below half the supply the branch is not
  // merely unhealthy but cannot be outvoted back, so the two are distinguished
  const healthCls = covPct >= needPct ? 'ok' : (covPct >= 0.5 ? 'warn' : 'bad');

  // participation is capital committed to consensus: what sequencers hold
  // themselves plus what is delegated to them
  const participating = Number(n.total_on_sequencers) + Number(n.delegated_capital);
  el('ledger').innerHTML =
    tile('LRB slot', num(d.lrb_slot),
         d.slots_behind + ' behind current (' + num(d.current_slot) + ')',
         d.slots_behind > 3 ? 'warn' : '', 'hero') +
    tile('Total supply', prox(d.supply),
         'genesis ' + prox(d.initial_supply) + ' · +' + share(supply - Number(d.initial_supply), supply) + ' since',
         '', 'hero') +
    tile('Ledger coverage delta', prox(d.coverage_delta), 'full coverage ' + prox(d.total_coverage), '', 'hero') +
    tile('Consensus health', pct(covPct, 2),
         'coverage delta of total supply · healthy needs ' + pct(needPct) +
         ' (' + d.healthy_numerator + '/' + d.healthy_denominator + ')' +
         '<div class="bar"><i class="' + healthCls + '" style="width:' +
         Math.min(100, 100 * covPct).toFixed(1) + '%"></i></div>',
         healthCls, 'hero') +
    tile('Capital participation in consensus', pct(supply ? participating / supply : 0, 2),
         'sequencers ' + prox(n.total_on_sequencers) + ' · ' + share(n.total_on_sequencers, supply) + ' of supply' +
         '<br>delegated (frozen) ' + prox(n.delegated_capital) + ' · ' + share(n.delegated_capital, supply) + ' of supply',
         '', 'hero') +
    tile('Annual inflation rate (cap)', pct(d.annual_inflation_cap_rate, 2),
         'theoretical maximum over the year from the current slot, on the supply as it stands' +
         '<br>chain ' + prox(d.annual_chain_inflation_cap) + ' · branch bonus ' + prox(d.annual_branch_bonus_cap) +
         ' · mined emission not included',
         '', 'hero');
}

function renderCensus(c, live) {
  const node = el('census');
  if (!c) {
    node.innerHTML = '<div class="pending">Census has not run yet — it walks the whole state and only reports when a pass completes.</div>';
    stamp(el('stamp-census'), null);
    return;
  }
  let h = '<div class="tiles">' +
    tile('Distinct accounts', num(c.num_controllers), 'by controller, across ' + num(c.num_utxos) + ' UTXOs') +
    tile('Chained outputs', num(c.num_chains), prox(c.on_chain_balance) + ' on chains') +
    tile('Plain-lock balance', prox(c.plain_lock_balance), share(c.plain_lock_balance, c.total_balance) + ' of scanned total') +
    tile('Scanned total', prox(c.total_balance), 'pass took ' + num(c.as_of.duration_ms) + ' ms') +
    '</div>';

  h += '<div class="scroll" style="margin-top:12px"><table><tr>' +
       '<th>Class</th><th>Outputs</th><th>Accounts</th><th>Balance</th><th>Share of supply</th></tr>';
  (c.classes || []).forEach(r => {
    h += '<tr><td>' + esc(r.class) + '</td><td>' + num(r.num_outputs) + '</td><td>' + num(r.num_controllers) +
         '</td><td>' + prox(r.balance) + '</td><td>' + pct(r.share_of_supply, 2) + '</td></tr>';
  });
  h += '</table></div>';

  const topTable = (title, rows) => {
    if (!rows || !rows.length) return '';
    let t = '<h3>' + title + '</h3><div class="scroll"><table><tr>' +
            '<th>Controller</th><th>Balance</th><th>Outputs</th><th>Share of supply</th></tr>';
    rows.forEach(r => {
      t += '<tr><td class="mono">' + esc(shortHex(r.controller)) + '</td><td>' + prox(r.balance) +
           '</td><td>' + num(r.num_outputs) + '</td><td>' + pct(r.share_of_supply, 3) + '</td></tr>';
    });
    return t + '</table></div>';
  };
  h += topTable('Biggest chained accounts', c.top_chain);
  h += topTable('Biggest ordinary accounts', c.top_plain);
  node.innerHTML = h;
  stamp(el('stamp-census'), c.as_of, 'full-state pass, as of', true);
}

function renderFairLaunch(d, hist) {
  const m = d.fair_launch;
  const contest = m && m.contest;
  if (!m || !m.present) {
    el('fairlaunch').innerHTML = '<div class="pending">No mine chain in this ledger state.</div>';
    el('transits-note').textContent = '';
    el('transits-fold').style.display = 'none';
    stamp(el('stamp-fairlaunch'), null);
    return;
  }
  const minted = Number(m.mined_amount);
  const slotMs = d.ledger.slot_duration_ms;
  const mintable = Number(m.mintable_init);
  const emitted = mintable ? minted / mintable : 0;

  const pace = (hist && hist.mean_pace > 0) ? hist.mean_pace : m.target_pace;
  const minePerSlot = Number(m.amount) / pace;
  const paceNote = 'at ' + pace.toFixed(2) + ' slots/transit' +
                   (hist && hist.mean_pace > 0 ? ' (observed)' : ' (target — no history yet)');
  const proj = (v) => {
    if (v === null) return '-';
    if (v === 0) return 'reached';
    const on = dateAfter(v, slotMs);
    return 'in ' + slotsDuration(v, slotMs) + (on ? ', ' + on : '');
  };
  const sinceTransit = d.lrb_slot > m.last_txslot ? d.lrb_slot - m.last_txslot : 0;
  // emission ends when what remains can no longer pay one transit
  const transitsLeft = Math.floor(Number(m.remaining) / Number(m.amount));

  // Milestones: when mined emission overtakes k times the bootstrap capital.
  // Both sides grow linearly in slots — mining by A per pace slots, bootstrap
  // capital at the constant genesis inflation rate — so the crossing is where
  // the two lines meet.
  const bootstrap = Number(m.bootstrap_capital);
  const bootstrapPerSlot = Number(m.bootstrap_per_slot);
  function milestone(k) {
    const gap = k * bootstrap - minted;
    if (gap <= 0) return 0;
    const flow = minePerSlot - k * bootstrapPerSlot;
    return flow > 0 ? gap / flow : null;   // null: mining never catches up
  }

  el('fairlaunch').innerHTML =
    tile('Bootstrap capital', prox(m.bootstrap_capital),
         'genesis ' + prox(d.initial_supply) + ' plus the most chain inflation it could have earned since',
         '', 'hero') +
    tile('Mined', prox(m.mined_amount),
         pct(emitted, 3) + ' of the ' + prox(m.mintable_init) + ' mintable budget' +
         '<br>' + num(m.mined_transactions) + ' transactions · ' + prox(m.amount) + ' each' +
         '<div class="bar"><i style="width:' + Math.min(100, 100 * emitted).toFixed(2) + '%"></i></div>',
         '', 'hero') +
    tile('Bootstrap capital share', pct(m.bootstrap_share, 2),
         'of supply · mined ' + pct(m.mined_share, 2) + ' of supply', '', 'hero') +
    tile('PoW difficulty B', (contest && contest.difficulty) ? contest.difficulty : m.difficulty,
         (contest && contest.difficulty && contest.difficulty !== m.difficulty
            ? 'live from the stream · confirmed ' + m.difficulty + ' · '
            : '') + 'floor ' + m.floor_difficulty + ' · ceiling ' + m.max_difficulty, '', 'hero') +
    tile('Pace', (hist && hist.mean_pace > 0 ? hist.mean_pace.toFixed(2) : '-') + ' slots',
         (hist && hist.pace_window > 0 ? 'mean slot gap over the last ' + hist.pace_window + ' transits' : 'no history yet') +
         ' · minimum ' + m.min_pace, '', 'hero') +
    tile('Transactions mined in last hour', hist ? num(hist.mined_last_hour) : '-',
         (sinceTransit ? 'last transit ' + slotsDuration(sinceTransit, slotMs) + ' ago' : 'last transit in this slot') +
         (hist ? ' · counted over ' + num(hist.window_slots) + ' slots to slot ' + num(hist.as_of.slot) : ''),
         sinceTransit > 4 * m.target_pace ? 'warn' : '', 'hero') +
    tile('Decentralization milestones',
         'mined &gt; bootstrap capital &mdash; ' + proj(milestone(1)) +
         '<br>mined &gt; 2 &times; bootstrap capital &mdash; ' + proj(milestone(2)),
         paceNote + ', bootstrap capital at its inflation cap', '', 'lines') +
    tile('All mined', transitsLeft > 0 ? 'in ' + slotsDuration(transitsLeft * pace, slotMs) : 'complete',
         (transitsLeft > 0 && dateAfter(transitsLeft * pace, slotMs)
            ? dateAfter(transitsLeft * pace, slotMs) + ' · ' : '') +
         num(transitsLeft) + ' transits left · ' + paceNote, '', 'hero') +
    tile('Competing miners', contest ? num(contest.competing_miners) : '-',
         contest
           ? num(contest.submissions) + ' transits offered in ' + contest.window_slots + ' slots · up to ' +
             num(contest.max_racing_same_predecessor) + ' racing the same predecessor' +
             (contest.rejected ? ' · ' + num(contest.rejected) + ' rejected' : '')
           : 'no transit seen on the stream yet', '', 'hero');
  stamp(el('stamp-fairlaunch'), d.as_of, 'live, as of');

  // the fold itself is static markup: rebuilding it every poll would snap it
  // shut on anyone who had it open
  const fold = el('transits-fold');
  if (!hist || !hist.transits || !hist.transits.length) {
    el('transits-note').textContent = 'Mine chain history not collected yet (it walks the txstore backwards).';
    fold.style.display = 'none';
    return;
  }
  el('transits-note').textContent = '';
  fold.style.display = '';
  el('stamp-transits').textContent = 'newest ' + hist.depth + ' · ' + hist.num_miners +
      ' distinct miners in the walk' + (hist.truncated_by ? ' · stopped: ' + hist.truncated_by : '');
  let h = '<div class="scroll"><table><tr><th>Slot</th><th>Pace</th><th>Difficulty</th><th>Miner</th></tr>';
  hist.transits.forEach(t => {
    h += '<tr><td>' + num(t.slot) + '</td><td>' + (t.pace || '-') + '</td><td>' + t.difficulty +
         '</td><td class="mono">' + esc(shortHex(t.miner)) + '</td></tr>';
  });
  el('transits').innerHTML = h + '</table></div>';
}

function renderNetwork(d) {
  const n = d.network;
  const supply = Number(d.supply);
  el('network').innerHTML =
    tile('Sequencers', num(n.num_sequencers),
         num(n.num_sequencers_active) + ' active · ' + num(n.num_sequencers - n.num_sequencers_active) + ' stalled',
         n.num_sequencers_active < n.num_sequencers ? 'warn' : 'ok') +
    tile('Capital on sequencers', prox(n.total_on_sequencers),
         share(n.total_on_sequencers, supply) + ' of supply · active ' + prox(n.active_on_sequencers)) +
    tile('Delegations', num(n.num_delegations),
         prox(n.delegated_capital) + ' · ' + share(n.delegated_capital, supply) + ' of supply') +
    tile('Sequencers to stop', n.sequencers_to_stop || '-',
         'to push coverage below the healthy threshold',
         n.sequencers_to_stop <= 1 ? 'bad' : (n.sequencers_to_stop <= 2 ? 'warn' : 'ok')) +
    tile('Top-1 / top-3 weight', pct(n.top_one_share) + ' / ' + pct(n.top_three_share),
         'share of branch coverage delta') +
    tile('Nodes seen', num(n.num_nodes),
         num(n.num_nodes_sequencer) + ' with sequencer mass · ' + ago(n.nodes_captured_unix) +
         '<div class="note">evidence this node has, not a census of what exists</div>');
  stamp(el('stamp-network'), d.as_of, 'live, as of');

  const rows = n.sequencers || [];
  let h = '<h3>Biggest sequencers</h3><div class="scroll"><table><tr>' +
          '<th>Name</th><th>Chain ID</th><th>Balance</th><th>Delegated</th><th>Delegations</th>' +
          '<th>Coverage delta</th><th>Last active</th><th>State</th></tr>';
  rows.forEach(s => {
    h += '<tr><td>' + esc(s.name || '-') + '</td><td class="mono">' + esc(shortHex(s.chain_id)) + '</td><td>' +
         prox(s.balance) + '</td><td>' + prox(s.delegated_capital) + '</td><td>' + num(s.num_delegations) +
         '</td><td>' + (s.coverage_delta === undefined ? '-' : prox(s.coverage_delta)) +
         '</td><td>slot ' + num(s.last_active_slot) + '</td><td class="' + (s.active ? 'ok' : 'bad') + '">' +
         (s.active ? 'active' : 'stalled') + '</td></tr>';
  });
  el('sequencers').innerHTML = h + '</table></div>';
}

// --- poll -------------------------------------------------------------------

async function refresh() {
  try {
    const r = await fetch('/api/v1/monitor');
    const d = await r.json();
    if (d.error) { el('head-sub').innerHTML = '<span class="bad">' + esc(d.error) + '</span>'; return; }
    if (!d.live) { el('head-sub').innerHTML = '<span class="pending">no live data</span>'; return; }
    el('head-sub').textContent = 'live tier refreshed every ' + (POLL_MS / 1000) + 's';
    renderIdent(d.live.ledger);
    renderLedger(d.live);
    renderCensus(d.census, d.live);
    renderFairLaunch(d.live, d.mine_history);
    renderNetwork(d.live);
  } catch (e) {
    el('head-sub').innerHTML = '<span class="bad">' + esc(e) + '</span>';
  }
}
refresh();
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
