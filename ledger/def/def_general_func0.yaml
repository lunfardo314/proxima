functions:
  -
    sym: isPathToConsumedOutput
    numArgs: 1
    source: hasPrefix($0, pathToConsumedOutputs)
  -
    sym: isPathToProducedOutput
    numArgs: 1
    source: hasPrefix($0, pathToProducedOutputs)
  -
    sym: consumedOutputPathByIndex
    numArgs: 1
    source: concat(pathToConsumedOutputs,$0)
  -
    sym: unlockParamsPathByIndex
    numArgs: 1
    source: concat(pathToUnlockParams,$0)
  -
    sym: producedOutputPathByIndex
    numArgs: 1
    source: concat(pathToProducedOutputs,$0)
  -
    sym: consumedOutputByIndex
    numArgs: 1
    source: "atPath(consumedOutputPathByIndex($0))"
  -
    sym: unlockParamsByIndex
    numArgs: 1
    source: "atPath(unlockParamsPathByIndex($0))"
  -
    sym: producedOutputByIndex
    numArgs: 1
    source: "atPath(producedOutputPathByIndex($0))"
  -
    sym: producedConstraintByIndex
    numArgs: 1
    source: "atPath(concat(producedOutputPathByIndex(byte($0,0)), byte($0,1)))"
  -
    sym: consumedConstraintByIndex
    numArgs: 1
    source: "atPath(concat(pathToConsumedOutputs,$0,$1))"
  -
    sym: unlockParamsByConstraintIndex
    numArgs: 1
    source: "atTuple8(unlockParamsByIndex(byte($0,0)), byte($0,1))"
  -
    sym: inputIDByIndex
    numArgs: 1
    source: "atPath(concat(pathToInputIDs,$0))"
  -
    sym: timestampOfInputByIndex
    numArgs: 1
    source: "timestampBytesFromPrefix(inputIDByIndex($0))"
  -
    sym: slotOfInputByIndex
    numArgs: 1
    source: "first4Bytes(inputIDByIndex($0))"
  -
    sym: txBytes
    numArgs: 0
    source: "atPath(pathToTransaction)"
  -
    sym: txSignatureData
    numArgs: 0
    source: "atPath(pathToSignatureData)"
  -
    sym: txTimestampBytes
    numArgs: 0
    source: "atPath(pathToTimestamp)"
  -
    sym: txExplicitBaseline
    numArgs: 0
    source: "atPath(pathToExplicitBaseline)"
  -
    sym: txSlot
    numArgs: 0
    source: "first4Bytes(txTimestampBytes)"
  -
    sym: txTick
    numArgs: 0
    source: "tickFromTimestampBytes(txTimestampBytes)"
  -
    sym: txSequencerOutputIndex
    numArgs: 0
    source: "byte(atPath(pathToSequencerDataBytes), 0)"
  -
    sym: txStemOutputIndex
    numArgs: 0
    source: "byte(atPath(pathToSequencerDataBytes), 1)"
  -
    sym: sequencerFlagON
    description: "$0 must be at least 5 bytes long, like in txid or timestamp prefix. Returns true if sequencer tx flag is ON"
    numArgs: 1
    source: "not(isZero(bitwiseAND(byte($0,4),0x01)))"
  -
    sym: branchFlagON
    description: "$0 must be at least 5 bytes long, like in txid or timestamp prefix. Returns true if sequencer tx flag is ON AND ticks is 0"
    numArgs: 1
    source: "equal(byte($0,4), 0x01)"
  -
    sym: isSequencerTransaction
    numArgs: 0
    source: "not(equal(0x, atPath(pathToSequencerDataBytes)))"
  -
    sym: isBranchTransaction
    numArgs: 0
    source: "and(isSequencerTransaction, isZero(tickFromTimestampBytes(txTimestampBytes)))"
  -
    sym: numEndorsements
    numArgs: 0
    source: "tupleLenAtPath(pathToEndorsements)"
  -
    sym: numInputs
    numArgs: 0
    source: "tupleLenAtPath(pathToInputIDs)"
  -
    sym: numProducedOutputs
    numArgs: 0
    source: "tupleLenAtPath(pathToProducedOutputs)"
  -
    sym: selfOutputPath
    numArgs: 0
    source: "slice(at,0,2)"
  -
    sym: selfSiblingConstraint
    numArgs: 1
    source: "atPath(concat(selfOutputPath, $0))"
  -
    sym: selfOutputBytes
    numArgs: 0
    source: "atPath(selfOutputPath)"
  -
    sym: selfNumConstraints
    numArgs: 0
    source: "tupleLenAtPath(selfOutputPath)"
  -
    sym: self
    numArgs: 0
    source: "atPath(at)"
  -
    sym: selfIsConsumedOutput
    numArgs: 0
    source: "isPathToConsumedOutput(at)"
  -
    sym: selfIsProducedOutput
    numArgs: 0
    source: "isPathToProducedOutput(at)"
  -
    sym: selfIsChainedOutput
    numArgs: 0
    source: "and(lessThan(u64/2, selfNumConstraints), equal(parseBytecode(selfSiblingConstraint(2), 0x), #chain))"
  -
    sym: selfOutputIndex
    numArgs: 0
    source: "byte(at, 2)"
  -
    sym: selfBlockIndex
    numArgs: 0
    source: "tail(at, 3)"
  -
    sym: selfConstraintIndex
    numArgs: 0
    source: "slice(at, 2, 3)"
  -
    sym: selfUnlockParameters
    numArgs: 0
    source: "atPath(concat(pathToUnlockParams, selfConstraintIndex))"
  -
    sym: selfSiblingUnlockParams
    numArgs: 1
    source: "atTuple8(atPath(concat(pathToUnlockParams, selfOutputIndex)), $0)"
  -
    sym: selfHasLockType
    description: $0 is call prefix label. Returns true if current output has specific lock type
    source: equal(parseBytecode(selfSiblingConstraint(1), 0x), $0)
  -
    sym: signatureProper
    description: "$0 must be signatureData (<sig type byte>+<signature proper>+<public key>). Returns proper signature part, depending on the signature type"
    numArgs: 1
    source: "if(equal(byte($0,0), 0), slice($0, 1, 64), !!!invalid_signature_type)"
  -
    sym: signaturePublicKey
    description: "$0 must be signatureData (<sig type byte>+<signature proper>+<public key>). Returns public key part, depending on the signature type"
    numArgs: 1
    source: "if(equal(byte($0,0), 0), slice($0, 65, 96), !!!invalid_signature_type)"
  -
    sym: validSignature
    description: "$0 must be txID (the message), $1 must be signatureData (<sig type byte>+<signature proper>+<public key>). Checks validity of the signature depending on the type"
    source: "validSignatureED25519($0, signatureProper($1), signaturePublicKey($1))"
  -
    sym: txHolderID
    description: "$0 must be signatureData. returns blake2b hash of <sig type byte>+<public key>"
    numArgs: 1
    source: "blake2b(concat(byte($0,0), signaturePublicKey($0)))"
