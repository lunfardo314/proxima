functions:
  # short
  -
    sym: "at"
    description: "returns path in the transaction of the validity constraint being evaluated"
    numArgs: 0
    embedded_as: evalPath
    short: true
  -
    sym: "atPath"
    description: "returns element of the transaction at path $0"
    numArgs: 1
    embedded_as: evalAtPath
    short: true
  # long
  -
    sym: "totalConsumed"
    description: "sum of consumed amounts by the transaction at index $0 (1 byte)"
    numArgs: -1
    embedded_as: evalTotalConsumed
  -
    sym: "totalProduced"
    description: "sum of produced amounts by the transaction at index $0 (1 byte)"
    numArgs: -1
    embedded_as: evalTotalProduced
  -
    sym: ticksBefore
    description: "number of ticks between timestamps $0 and $1 as big-endian uint64 if $0 is before $1, or 0x otherwise"
    numArgs: 2
    embedded_as: evalTicksBefore64
  -
    sym: randomFromSeed
    description: "uses $0 as seed to deterministically calculate a pseudo-random value. Returns 8-byte big-endian integer bytes in the interval [0,$1)"
    numArgs: 2
    embedded_as: evalRandomFromSeed
  -
    sym: txID
    description: "returns ID of the transaction"
    numArgs: 0
    embedded_as: evalTxID
  -
    sym: tupleLenAtPath
    description: "$0 is path where a tuple is expected. Function returns number of elements of that tuple as big-endian 8 bytes"
    numArgs: 1
    embedded_as: evalTupleLenAtPath
  -
    sym: tupleHasDuplicatesAtPath
    description: "$0 is path where a tuple is expected. Function returns non-empty byte slice if the tuple has duplicated"
    numArgs: 1
    embedded_as: evalTupleHasDuplicatesAtPath
  -
    sym: embeddedEnforceFrozenCoverageOnDelegateOutput
    description: "enforces amounts on delegate output"
    numArgs: 0
    embedded_as: embeddedEnforceFrozenCoverageOnDelegateOutput
  -
    sym: embeddedEnforceFrozenCoverageOnNonDelegationChain
    description: "enforces amounts on delegate output"
    numArgs: 0
    embedded_as: embeddedEnforceFrozenCoverageOnNonDelegationChain
  -
    sym: embeddedIsInflationAndFrozenCoverageZero
    description: "returns true if inflation and frozen coverage amount are all zero"
    numArgs: 0
    embedded_as: embeddedIsInflationAndFrozenCoverageZero


