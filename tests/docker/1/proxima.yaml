# Configuration file for the Proxima node
# For the first bootstrap node this must be true
# If false or absent, it will require at least one statically configured peer 
# and will not wait for syncing when starting sequencer  
bootstrap: false

# Peering configuration
peering:
  # libp2p host data:
  host:
    # host ID private key
    id_private_key: 2b54b6ccfb26b6ed8ce0f36cf852959ca736a93f41f19ab299b0018c31d4a3d3cadbae7d24801b0a69173af2c70193f5909b1d22bd588119b1af449a6512e14e
    # host ID is derived from the host ID public key.
    id: 12D3KooWPUEp1PNhoyXqC8E9DYd1ntBXT1Z9PCPVHV5hfUyJ2CSZ
    # port to connect from other peers
    port: 4000

  # YAML dictionary (map) of statically pre-configured peers. Also used in the peering boostrap phase by Kademlia DHT
  # It will be empty for the first bootstrap node in the network. In that case must be peering.host.bootstrap = true
  # Must be at least 1 static for non-bootstrap node
  # Each static peer is specified as a pair <name>: <multiaddr>, where:
  # -- <name> is unique mnemonic name used for convenience locally
  # -- <multiaddr> is the libp2p multi-address in the form '/ip4/<IPaddr ir URL>/<port>/tcp/p2p/<hostID>'
  # for more info see https://docs.libp2p.io/concepts/fundamentals/addressing/
  peers:
    # Example -> boot: /ip4/127.0.0.1/tcp/4000/p2p/12D3KooWL32QkXc8ZuraMJkLaoZjRXBkJVjRz7sxGWYwmzBFig3M
    boot: /ip4/172.16.238.10/udp/4000/quic-v1/p2p/12D3KooWSEDuiViLCgy6RvzQWeziKk79aAMikGPFnMKjnLzv9TVi
    friendlyPeer: /ip4/172.16.238.10/udp/4000/quic-v1/p2p/12D3KooWSEDuiViLCgy6RvzQWeziKk79aAMikGPFnMKjnLzv9TVi
    
  # Maximum number of peers which may be connected to via the automatic peer discovery
  # max_dynamic_peers > 0 means automatic peer discovery (autopeering) is enabled, otherwise disabled
  max_dynamic_peers: 4

  # defines if local IPs are allowed to be used for autopeering.
  allow_local_ips: true

# Node's API config
api:
    # server port
  port: 8000

# logger config
# logger.previous can be 'erase' or 'save'
logger:
  level: info
  output: proxima.log
  # options: 'erase' (previous will be erased), 'save' (previous will be saved and then deleted)
  # Otherwise or when absent: log will be appended in the same existing file
  previous: erase
#  log_attacher_stats: true

# Other parameters used for tracing and debugging
# Prometheus metrics exposure
metrics:
  # expose Prometheus metrics yes/no
  enable: false
  port: 14000

# list of enabled trace tags.
# When enabled, it forces tracing of the specified module.
# It may be very verbose
# Search for available trace tags the code for "TraceTag"
trace_tags:
#  - autopeering
#  - inclusion
#  - backlog
#  - gossip
#  - pull_server
#  - txinput
#  - txStore
#  - global
#  - backlog
#  - propose-base
#  - pruner


# map of maps of sequencer configuration <local seq name>: <seq config>
# <local seq name> is stored into each sequencer transaction, so better keep it short 
# usually none or 1 sequencer is enabled for the node
# 0 enabled sequencers means node is a pure access node
# If sequencer is enabled, it is working as a separate and independent process inside the node
sequencer:
    name: ""
    # start sequencer yes/no
    enable: false
    # chain ID of the sequencer
    # chain ID 6393b6781206a652070e78d1391bc467e9d9704e9aa59ec7f7131f329d662dcc is
    # predefined chain ID of the genesis chain (the bootstrap sequencer)
    # Sequencer chain is created by 'proxi node mkchain' command
    # All chains controlled by the wallet can be displayed by 'proxi node chains'
    chain_id: <sequencer ID hex encoded>
    # sequencer chain controller's private key (hex-encoded)
    controller_key_file: proxima.key
    # sequencer pace. Distance in ticks between two subsequent sequencer transactions
    # cannot be less than the sequencer pace value set by the ledger
    pace: 12
    # maximum tag-along inputs per milestone (default: 15). Controls batch size.
    max_tag_along_inputs: 15
    # target tag-alongs to drain per slot (default: 100, ~10 TPS per sequencer).
    # Together with max_tag_along_inputs, controls how many drain milestones per slot.
    tag_along_drain_rate: 100
    # write separate sequencer log (default: false)
    logging: false
    # if logging = true, duplicate sequencer log messages to the node's log (default: false)
    global_logging: false
    # force_activity: always issue branch + milestone regardless of throttle pressure.
    # Use for bootstrap sequencers that must keep producing to maintain network liveness.
    # force_activity: false
    # disable_throttle: disable tag-along budget throttling entirely.
    # Budget always stays at full (2/3 of consensus). For debugging.
    # disable_throttle: false
    # standalone: bypass the libp2p connectivity check before submitting milestones.
    # Use ONLY for single-node dev networks (no peers by design). NEVER enable on a
    # networked sequencer: it would allow building one-sided forks during a partition.
    # standalone: false


# Sync configuration (sequential branch-by-branch catch-up)
# Self URLs (localhost with own api.port) are automatically skipped.
sync:
#   # trusted API endpoints to request branch lists from during sync
#   # cycles to next source on failure
   sources:
     - "http://172.16.238.10:8000"
#     - "http://<access-node-2-ip>:<api-port>"
#   # gap thresholds (in slots) with hysteresis to avoid oscillation
#   # start forward-sync when gap >= threshold_up (default: 10)
#   threshold_up: 10
#   # stop forward-sync when gap <= threshold_down (default: 4)
#   threshold_down: 4
#   # pull k-th branch ahead to parallelize past cone solidification (default: 5)
#   pull_ahead: 5
#   # max branches to commit per sync tick before forcing GC (default: 10)
#   # lower values reduce memory spikes during rapid forward-sync at the cost of slower catch-up
#   commit_batch: 10

# Memory management
# When limit_mb > 0, sets Go's soft GC limit (debug.SetMemoryLimit) and starts
# a watchdog that initiates graceful shutdown when heap reaches the limit (stress = 100%).
# gogc controls Go's GC frequency (default 50, Go default is 100). Lower values make GC
# run more often, keeping the heap compact and reducing sensitivity to allocation spikes.
# memory:
#   # soft memory limit in MB; 0 = disabled (default)
#   limit_mb: 0
#   # GOGC percentage (default: 50). Lower = more frequent GC, less spike sensitivity
#   gogc: 50
