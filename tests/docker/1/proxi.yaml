# proxi profile 

# default sequencer ID is used when own or tag-along sequencer is not specified
default_sequencer_id: 9d2c6fedeb0f31a9a97d28c59b276402f6c8e78777b89a82

wallet:
    key_file: proxima.key
    holder_id: ce37deb7b4f84e7e311d0d80b37c0c0d663aa8395f6808373759ff42c83fbe33
    # sequencer_id is the sequencer ID controlled by the private key of the wallet.
    # The controller wallet can withdraw tokens from the sequencer chain with command 'proxi node seq withdraw'
    # Default is the bootstrap sequencer ID; change if you control a different sequencer
    sequencer_id: 9d2c6fedeb0f31a9a97d28c59b276402f6c8e78777b89a82
    
api:
    endpoint: http://0.0.0.0:8000
tag_along:
    sequencer_id: 9d2c6fedeb0f31a9a97d28c59b276402f6c8e78777b89a82
    fee: 500
finality:
    inclusion_threshold:
        numerator: 2
        denominator: 3
    weak: false

# provides parameters for 'proxi node spam' command
# The spammer in a loop sends bundles of transactions to the target address by using specified tag-along sequencer
# Before sending next bundle, the spammer waits for the finality of the previous according to the provided criterion
spammer:
    bundle_size: 5
    output_amount: 1000
    pace: 25
    tag_along:
        fee: 500
        # <sequencer ID hex encoded> is tag-along sequencer ID for the tip transaction in the bundle
        # For example the bootstrap sequencer af7bedde1fea222230b82d63d5b665ac75afbe4ad3f75999bb3386cf994a6963
        sequencer_id: 9d2c6fedeb0f31a9a97d28c59b276402f6c8e78777b89a82
    # target address
    target: a(ce37deb7b4f84e7e311d0d80b37c0c0d663aa8395f6808373759ff42c83fbe33)

faucet:
    port:	9500
    host:  172.16.238.10